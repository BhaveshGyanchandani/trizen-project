name: CI/CD Pipeline

# Defines WHEN this workflow runs
on:
  push:
    branches: [ main, master, dev ]        # Runs automatically whenever code is pushed to these branches
  pull_request:
    branches: [ main, master, dev ]        # Runs whenever a PR is opened/updated targeting these branches
  workflow_dispatch:                        # Allows manually triggering this workflow from the GitHub Actions UI

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # Purpose: Catch code style issues and broken logic BEFORE building
  # ─────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci_test_jwt_secret_key_2026"
      MONGODB_URI: "mongodb://127.0.0.1:27017/trizen_test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 2: Build
  # Purpose: Confirm the app compiles/builds successfully
  # ─────────────────────────────────────────────
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest
    needs: lint-and-test

    env:
      JWT_SECRET: "ci_test_jwt_secret_key_2026"
      MONGODB_URI: "mongodb://127.0.0.1:27017/trizen_test"
      NEXT_PUBLIC_APP_URL: "http://localhost:5000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

  # ─────────────────────────────────────────────
  # JOB 3: Deploy to Vercel
  # Purpose: Automatically deploy to production AFTER build succeeds
  # Requires VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID configured in GitHub Repository Secrets
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Vercel
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --prod --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}