name: CI/CD Pipeline

# Defines WHEN this workflow runs
on:
  push:
    branches: [ main, master, dev ]        # Runs automatically whenever code is pushed to these branches
  pull_request:
    branches: [ main, master, dev ]        # Runs whenever a PR is opened/updated targeting these branches
  workflow_dispatch:                        # Allows manually triggering this workflow from the GitHub Actions UI (no code push needed)

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test
  # Purpose: Catch code style issues and broken logic BEFORE building
  # ─────────────────────────────────────────────
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest                  # Runs on a fresh Ubuntu virtual machine provided by GitHub

    # Environment variables available to all steps in this job
    # These are dummy/test values used ONLY inside the CI environment — not real production secrets
    env:
      JWT_SECRET: "ci_test_jwt_secret_key_2026"          # Fake JWT secret so auth-related code doesn't crash during tests
      MONGODB_URI: "mongodb://127.0.0.1:27017/trizen_test" # Points to a local/test Mongo instance, not the real DB

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4            # Pulls your repo's code onto the runner so later steps can access it

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20                   # Installs Node.js v20 on the runner
          cache: 'npm'                        # Caches npm dependencies between runs to speed up future builds

      - name: Install Dependencies
        run: npm ci                          # Installs exact dependency versions from package-lock.json (faster & more reliable than `npm install` in CI)

      - name: Run Linter
        run: npm run lint                    # Runs ESLint (or whatever your `lint` script is) to catch style/code-quality issues

      - name: Run Unit Tests
        run: npm test                        # Runs your test suite (e.g. Jest) to catch broken functionality

  # ─────────────────────────────────────────────
  # JOB 2: Build
  # Purpose: Confirm the app actually compiles/builds successfully
  # Only runs if Job 1 (lint-and-test) passes, thanks to `needs:` below
  # ─────────────────────────────────────────────
  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest
    needs: lint-and-test                     # This job WAITS for lint-and-test to succeed before starting — enforces pipeline order

    env:
      JWT_SECRET: "ci_test_jwt_secret_key_2026"
      MONGODB_URI: "mongodb://127.0.0.1:27017/trizen_test"
      NEXT_PUBLIC_APP_URL: "http://localhost:5000"        # Public-facing URL used during build (e.g. for API calls baked into the frontend)

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4            # Fresh checkout again — each job runs on its own separate VM, so nothing is shared automatically

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build                   # Runs `next build` — compiles the app for production, catches build-time errors (type errors, import issues, etc.)

  # ─────────────────────────────────────────────
  # JOB 3 (DISABLED): Deploy
  # Purpose: Automatically deploy to production AFTER build succeeds
  # Currently commented out — enable once you add a VERCEL_TOKEN secret in GitHub repo settings
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: VERCEL_TOKEN
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: npx vercel --token=${{ secrets.VERCEL_TOKEN }} --prod
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}