name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci_test_jwt_secret_key_2026"
      MONGODB_URI: "mongodb://127.0.0.1:27017/trizen_test"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  build:
    name: Build Next.js Application
    runs-on: ubuntu-latest
    needs: lint-and-test

    env:
      JWT_SECRET: "ci_test_jwt_secret_key_2026"
      MONGODB_URI: "mongodb://127.0.0.1:27017/trizen_test"
      NEXT_PUBLIC_APP_URL: "http://localhost:5000"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

